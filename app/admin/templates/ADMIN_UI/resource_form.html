{% extends "ADMIN_UI/layout.html" %}

{% block title %}Edit Resource - Admin Panel{% endblock %}
{% block page_title %}Edit Resource: {{ key }}{% endblock %}

{% block content %}
<a href="{{ url_for('admin.resources_list') }}" class="btn btn-sm btn-outline-secondary mb-3">← Back</a>

<div class="card" style="max-width: 600px;">
    <div class="card-header bg-primary text-white">
        <h5 class="mb-0">Resource: {{ key }}</h5>
    </div>
    <form method="POST">
        <div class="card-body">
            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <div class="mb-3">
                <label for="label" class="form-label">Label</label>
                <input type="text" class="form-control" id="label" name="label" value="{{ resource.get('label', '') }}" required>
            </div>

            <div class="mb-3">
                <label for="kind" class="form-label">Kind</label>
                <input type="text" class="form-control" id="kind" name="kind" value="{{ resource.get('kind', 'resource') }}">
            </div>
        </div>
        <div class="card-footer">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{{ url_for('admin.resources_list') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
