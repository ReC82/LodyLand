levels:
- level: 13
  xp_required: 3200
  rewards:
  - type: currency
    currency: primary
    amount: 1500
  - type: card
    card_key: land_jurassic
  - type: currency
    currency: premium
    amount: 2
  story_events:
  - id: unlock_jurassic_card
    trigger: on_level_reached
    land_key: land_jurassic
    show_once: true
    modal_variant: centered
    pages:
    - speaker: self
      mood: surprised
      text:
        fr: "Des fossiles… des empreintes gigantesques dans la roche… Cette partie de l'île est bien plus ancienne que tout ce que j'ai vu jusqu'ici."
        en: "Fossils… giant footprints in the rock… This part of the island is far older than anything I've seen so far."
    - speaker: self
      mood: curious
      text:
        fr: "Des créatures préhistoriques rodent peut-être encore ici. Il faudra être prudent. Mais les ressources qu'on peut y trouver… ça en vaut le risque."
        en: "Prehistoric creatures may still roam here. I'll need to be careful. But the resources you can find here… it's worth the risk."
    - speaker: self
      mood: determined
      text:
        fr: "Bienvenue dans les terres Jurassiques. Tâchons de ne pas finir en ambre."
        en: "Welcome to the Jurassic lands. Let's try not to end up in amber."
