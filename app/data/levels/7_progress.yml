levels:
  - level: 7
    xp_required: 400
    rewards:
      - type: coins
        amount: 400

    story_events:
      - id: "level_7_short_thought"
        trigger: "on_level_reached"
        show_once: true
        modal_variant: "toast"

        pages:
          - speaker: "self"
            mood: "thinking"
            text:
              fr: >
                On m'a parlé d'un temple ancien caché quelque part sur cette île.
                Il paraît que c'est là que tout a commencé.
              en: >
                I've heard about an ancient temple hidden somewhere on this island.
                They say that's where it all began.