levels:
- level: 19
  xp_required: 30000
  rewards:
  - type: currency
    currency: primary
    amount: 4000
  - type: card
    card_key: land_haunted_forest
  - type: currency
    currency: premium
    amount: 5
  story_events:
  - id: unlock_haunted_forest_card
    trigger: on_level_reached
    land_key: land_haunted_forest
    show_once: true
    modal_variant: centered
    pages:
    - speaker: self
      mood: worried
      text:
        fr: "Les arbres ici sont noirs jusqu'à la moelle. L'air sent la cendre froide et quelque chose d'autre… quelque chose que je n'arrive pas à nommer."
        en: "The trees here are black to the core. The air smells of cold ash and something else… something I can't quite name."
    - speaker: self
      mood: curious
      text:
        fr: "Des silhouettes glissent entre les branches. Ce ne sont pas des animaux. Ni des humains. Mais elles ne semblent pas hostiles… pour l'instant."
        en: "Shapes slip between the branches. They're not animals. Not humans either. But they don't seem hostile… for now."
    - speaker: self
      mood: determined
      text:
        fr: "Bois maudit, essences fantômes, reliques corrompues… Je récolterai tout. Cette forêt hantée ne me fait pas peur."
        en: "Cursed wood, ghost essences, corrupted relics… I'll gather it all. This haunted forest doesn't scare me."
