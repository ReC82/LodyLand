levels:
  - level: 2
    xp_required: 40
    rewards:
      - type: card
        card_key: land_beach

    story_events:
      - id: "unlock_beach_card"
        trigger: "on_level_reached"
        land_key: "land_beach"
        show_once: true
        modal_variant: "centered"

        pages:
          - speaker: "self"
            mood: "surprised"
            text:
              fr: >
                Une plage ? Donc cette île ne se résume pas à la forêt…
              en: >
                A beach? So this island is more than just a forest…

          - speaker: "self"
            mood: "observing"
            text:
              fr: >
                Du sable, de l’eau salée, du bois flotté…
                Je pourrais sans doute trouver d’autres ressources ici.
              en: >
                Sand, salt water, driftwood…
                I can probably find different resources here.

          - speaker: "self"
            mood: "focused"
            text:
              fr: >
                Et là-bas… on dirait de la fumée qui monte dans le ciel.
                S’il y a du feu, il y a peut-être quelqu’un.
              en: >
                And over there… looks like smoke rising into the sky.
                If there’s fire, maybe somebody is there.

          - speaker: "self"
            mood: "determined"
            text:
              fr: >
                Je vais essayer de m’en approcher en ramassant
                tout ce que je peux sur le chemin.
              en: >
                I’ll try to reach it while gathering
                everything I can along the way.
