# app/data/crafts/craft_base_table.yml

crafts:

  # Hache en bois – 1x3
  tool_wooden_axe:
    key: tool_wooden_axe
    station_key: craft_table_base

    required_grid:
      tier: 1        # 1x3 (début du jeu)

    output:
      kind: tool
      key: tool_wooden_axe
      quantity: 1

    recipe:
      pattern:
        - "BBS"
      legend:
        B:
          kind: resource
          key: branch
          quantity: 1
        S:
          kind: resource
          key: stick
          quantity: 1

    craft_time_seconds: 8
    xp_reward: 5

    unlock:
      recipe_card_key: recipe_tool_wooden_axe
      min_level: 2

    enabled: true

  # Lingot de fer – 2x3
  iron_ingot:
    key: iron_ingot
    station_key: craft_table

    required_grid:
      tier: 2        # 2x3, débloqué par la carte upgrade_craft_table_2

    output:
      kind: resource
      key: iron_ingot
      quantity: 1

    recipe:
      pattern:
        - "III"
        - "CCC"
      legend:
        I:
          kind: resource
          key: iron_ore
          quantity: 1
        C:
          kind: resource
          key: coal
          quantity: 1

    craft_time_seconds: 20
    xp_reward: 10

    unlock:
      recipe_card_key: recipe_iron_ingot
      min_level: 3

    enabled: true

  # Épée en bois – 3x3
  weapon_wooden_sword:
    key: weapon_wooden_sword
    station_key: craft_table_base

    required_grid:
      tier: 3        # 3x3, débloqué par upgrade_craft_table_3

    output:
      kind: weapon
      key: weapon_wooden_sword
      quantity: 1

    recipe:
      pattern:
        - ".W."
        - ".W."
        - ".S."
      legend:
        W:
          kind: resource
          key: wooden_plank
          quantity: 1
        S:
          kind: resource
          key: stick
          quantity: 1

    craft_time_seconds: 15
    xp_reward: 12

    unlock:
      recipe_card_key: recipe_weapon_wooden_sword
      min_level: 4

    enabled: true
