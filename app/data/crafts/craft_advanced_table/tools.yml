tool_wooden_shovel:
  key: tool_wooden_shovel
  station_key: craft_table_advanced

  required_grid:
    tier: 3      

  output:
    kind: tool
    key: tool_wooden_shovel
    quantity: 1

  recipe:
    pattern:
      - "BBB"
      - ".B."
      - ".B."      
    legend:
      B:
        kind: resource
        key: branch
        quantity: 1
      S:
        kind: resource
        key: wooden_stick
        quantity: 1

  craft_time_seconds: 10
  xp_reward: 8

  unlock:
  - type: card
    key: recipe_tool_shovel_basic

  - type: level
    min_level: 2

  enabled: true

