# app/data/buildings.yml
# =====================================================================
# DÉFINITIONS DES BUILDINGS
#
# Chaque building est identifié par une clé (building_key).
# La carte correspondante (card_type: building_access) porte la même clé
# dans card_gameplay.building_key.
#
# CYCLE DE VIE D'UN BUILDING (PlayerBuilding) :
#   pending_resources  → le joueur dépose les matériaux (banqués, irrécupérables)
#   pending_construction → toutes les ressources sont réunies, en attente du lancement
#   under_construction → construction en cours (barre de progression temps)
#   operational        → building actif, peut produire
#
# SYSTÈME DE PRODUCTION :
#   type: crafting     → le joueur choisit une recette et lance manuellement
#   type: processing   → le building transforme automatiquement un intrant en sortant
#   type: passive      → effet permanent, pas de recette ni de carburant
#
# CARBURANT (fuel) :
#   resource           → clé de la ressource consommée
#   consumption_per_hour → quantité brûlée par heure quand le building tourne
#   Le building s'arrête automatiquement si le réservoir est vide.
#   Le joueur peut y déposer du carburant à tout moment.
# =====================================================================

buildings:

  # ----------------------------------------------------------------
  # CUISINE DE BASE
  # ----------------------------------------------------------------
  basic_kitchen:
    key: basic_kitchen
    card_key: building_basic_kitchen         # carte qui débloque ce building
    label: Cuisine de base
    label_en: Basic Kitchen
    description: >
      Une petite cuisine rustique pour préparer des plats simples.
      Chaque plat cuisiné accorde un buff temporaire au personnage.
    image: /static/assets/img/buildings/basic_kitchen.png
    min_level: 11

    construction:
      duration_seconds: 14400              # 4 heures
      materials:
        stone: 300
        branch: 200
        vine: 100
        wooden_plank: 50                   # item craftable

    production:
      type: crafting                       # le joueur choisit la recette
      fuel:
        resource: wood
        consumption_per_hour: 5            # 5 bois/heure quand actif
        tank_max: 500                      # réservoir max
      recipes:
        - key: cooked_fish_basic
          label: Poisson grillé
          label_en: Grilled fish
          inputs:
            - resource: fish
              quantity: 3
          output:
            item: cooked_fish_basic
            quantity: 1
          duration_seconds: 300            # 5 min
          xp_reward: 5
          effect:                          # buff temporaire accordé au joueur
            type: xp_multiplier
            amount: 1.5
            duration_seconds: 1800        # 30 min

        - key: berry_jam
          label: Confiture de baies
          label_en: Berry jam
          inputs:
            - resource: berry
              quantity: 10
            - resource: sand                # récipient de sable vitrifié (simplification)
              quantity: 2
          output:
            item: berry_jam
            quantity: 1
          duration_seconds: 600
          xp_reward: 8
          effect:
            type: harvest_multiplier
            amount: 1.3
            duration_seconds: 3600        # 1 heure

    upgrades: []                           # réservé pour futures versions

  # ----------------------------------------------------------------
  # FONDERIE
  # ----------------------------------------------------------------
  foundry:
    key: foundry
    card_key: building_foundry
    label: Fonderie
    label_en: Foundry
    description: >
      Un four à haute température qui fond les minerais bruts en lingots
      utilisables à la Forge ou à la table de craft. Bien plus rapide
      que la table de craft classique.
    image: /static/assets/img/buildings/foundry.png
    min_level: 11

    construction:
      duration_seconds: 57600             # 16 heures
      materials:
        stone: 1000
        iron_ore: 200
        coal: 100
        branch_plank: 100                 # item craftable

    production:
      type: processing                    # transformation automatique en boucle
      fuel:
        resource: coal
        consumption_per_hour: 8
        tank_max: 400
      recipes:
        - key: smelt_iron_ingot
          label: Fonte — Lingot de fer
          label_en: Smelt — Iron ingot
          inputs:
            - resource: iron_ore
              quantity: 3
            - resource: coal
              quantity: 1
          output:
            resource: iron_ingot
            quantity: 1
          duration_seconds: 60            # 1 min (vs 20s table craft, mais batch auto)
          xp_reward: 12

        - key: smelt_gold_ingot
          label: Fonte — Lingot d'or
          label_en: Smelt — Gold ingot
          inputs:
            - resource: gold_ore
              quantity: 5
            - resource: coal
              quantity: 2
          output:
            resource: gold_ingot
            quantity: 1
          duration_seconds: 180
          xp_reward: 25

    upgrades: []

  # ----------------------------------------------------------------
  # FORGE
  # ----------------------------------------------------------------
  forge:
    key: forge
    card_key: building_forge
    label: Forge
    label_en: Forge
    description: >
      Forgez des outils et des armes en métal de haute qualité.
      Accède à des recettes impossibles à réaliser à la table de craft
      standard. Nécessite des lingots produits par la Fonderie.
    image: /static/assets/img/buildings/forge.png
    min_level: 11

    construction:
      duration_seconds: 86400             # 24 heures
      materials:
        stone: 1500
        iron_ingot: 100
        coal: 200
        rope: 50                          # item craftable

    production:
      type: crafting
      fuel:
        resource: coal
        consumption_per_hour: 10
        tank_max: 500
      recipes:
        - key: forge_iron_axe
          label: Hache en fer
          label_en: Iron axe
          inputs:
            - resource: iron_ingot
              quantity: 5
            - item: wooden_stick
              quantity: 2
          output:
            tool: tool_iron_axe
            quantity: 1
          duration_seconds: 900           # 15 min
          xp_reward: 40

        - key: forge_iron_pickaxe
          label: Pioche en fer
          label_en: Iron pickaxe
          inputs:
            - resource: iron_ingot
              quantity: 6
            - item: wooden_stick
              quantity: 2
          output:
            tool: tool_iron_pickaxe
            quantity: 1
          duration_seconds: 1200
          xp_reward: 50

        - key: forge_iron_sword
          label: Épée en fer
          label_en: Iron sword
          inputs:
            - resource: iron_ingot
              quantity: 8
            - item: wooden_stick
              quantity: 1
          output:
            weapon: weapon_iron_sword
            quantity: 1
          duration_seconds: 1800
          xp_reward: 75

    upgrades: []

  # ----------------------------------------------------------------
  # USINE À CRAFT
  # ----------------------------------------------------------------
  craft_factory:
    key: craft_factory
    card_key: building_craft_factory
    label: Usine à craft
    label_en: Craft Factory
    description: >
      Automatisez vos recettes de craft. Configurez une file de travaux
      et l'usine produit en continu pendant votre absence.
      Compatible avec toutes les recettes de la table de craft standard.
    image: /static/assets/img/buildings/craft_factory.png
    min_level: 11

    construction:
      duration_seconds: 172800            # 48 heures
      materials:
        stone: 2000
        iron_ingot: 300
        branch_plank: 500
        rope: 200
        vine: 500

    production:
      type: crafting                      # queue automatique
      auto_loop: true                     # relance la recette en boucle si ressources dispo
      fuel:
        resource: wood                    # carburant principal
        resource_alt: coal               # carburant alternatif (priorité charbon si dispo)
        consumption_per_hour: 20
        tank_max: 2000
      # Compatible avec toutes les recettes de crafts.yml — pas de liste ici,
      # la factory lit directement crafts.yml au runtime.
      queue_slots: 5                      # nombre de travaux en file simultanément
      speed_multiplier: 0.8              # 20% plus rapide que la table manuelle

    upgrades: []

  # ----------------------------------------------------------------
  # ENTREPÔT
  # ----------------------------------------------------------------
  warehouse:
    key: warehouse
    card_key: building_warehouse
    label: Entrepôt
    label_en: Warehouse
    description: >
      Un grand entrepôt qui augmente votre capacité maximale de stockage.
      Bâtiment passif — aucun carburant, aucune recette.
      Son effet s'applique dès que la construction est terminée.
    image: /static/assets/img/buildings/warehouse.png
    min_level: 11

    construction:
      duration_seconds: 28800             # 8 heures
      materials:
        stone: 500
        branch: 800
        branch_plank: 200
        rope: 100

    production:
      type: passive                       # effet permanent, pas d'action requise
      effect:
        type: storage_multiplier
        amount: 2.0                       # double la capacité de stockage globale

    upgrades: []                          # ex: warehouse_level_2 pourrait x3 le stockage
