haunted_forest:
  key: land_haunted_forest
  label: "Forêt Hantée"
  short_description: "Une forêt sombre envahie de créatures spectrales"
  full_description: land_haunted_forest_description

  starting_land: false
  slots: 3
  slot_icon: static/assets/img/lands/nopic_slot.png
  logo: static/assets/img/lands/no_logo.png

  additional_slot_base_cost_diams: 50
  additional_slot_cost_multiplier: 1.8

  xp_per_collect: 8

  tools:
    any:
      extra_loot:
        - resource: ghost_essence
          chance: 0.05
          min: 1
          max: 1
    hands:
      label: "Mains nues"
      emoji: "🤲"
      cooldown_seconds: 45
      xp_multiplier: 1.0
      base_loot:
        - resource: dark_wood
          chance: 1.0
          min: 1
          max: 2
      extra_loot:
        - resource: cursed_vine
          chance: 0.25
          min: 1
          max: 1

    tool_wooden_axe:
      label: "Hache en bois"
      emoji: "🪓"
      cooldown_seconds: 75
      xp_multiplier: 1.3
      base_loot:
        - resource: dark_wood
          chance: 1.0
          min: 2
          max: 4
      extra_loot:
        - resource: ghost_essence
          chance: 0.1
          min: 1
          max: 1

    tool_wooden_knife:
      label: "Couteau en bois"
      emoji: "🔪"
      cooldown_seconds: 160
      xp_multiplier: 1.7
      base_loot:
        - resource: bone_dust
          chance: 1.0
          min: 1
          max: 3
      extra_loot:
        - resource: ghost_essence
          chance: 0.2
          min: 1
          max: 2
        - resource: cursed_relic
          chance: 0.04
          min: 1
          max: 1
