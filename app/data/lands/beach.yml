beach:
  key: land_beach
  label_fr: Plage
  label_en: Beach
  starting_land: false
  slots: 4
  slot_icon: static/assets/img/lands/beach_slot.png
  logo: static/assets/img/lands/beach_logo.png
  html_description: templates/GAME_UI/lands/land_beach_description.html
  additional_slot_base_cost_diams: 15
  additional_slot_cost_multiplier: 1.6

  xp_per_collect: 2

  tools:
    any:
      extra_loot:
        - resource: nautilus_shell
          chance: 0.5
          min: 1
          max: 1  
    hands:
      label: "Mains nues"
      emoji: "🤲"
      cooldown_seconds: 20
      xp_multiplier: 1.0
      base_loot:
        - resource: sand
          min: 1
          max: 1
          chance: 1.0
      extra_loot:
        - resource: seashell
          min: 1
          max: 1
          chance: 0.15
        - resource: starfish
          min: 1
          max: 1
          chance: 0.10
        - resource: pearl
          min: 1
          max: 1
          chance: 0.05

    tool_wooden_shovel:         # 👈 clé = item_key de ta pelle (à adapter)
      label: "Pelle de plage"
      emoji: "🪣"
      # requires_item: tool_sand_shovel  # tu peux le laisser implicite
      cooldown_seconds: 25
      xp_multiplier: 1.1
      base_loot:
        - resource: sand
          min: 1
          max: 2
          chance: 1.0
      extra_loot:
        - resource: seashell
          min: 1
          max: 1
          chance: 0.015
        - resource: starfish
          min: 1
          max: 1
          chance: 0.10
        - resource: pearl
          min: 1
          max: 1
          chance: 0.05
      
