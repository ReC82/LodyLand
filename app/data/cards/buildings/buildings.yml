# =====================================================================
# BUILDING ACCESS CARDS
# card_type: building_access
# card_category: building
#
# Ces cartes débloquent la possibilité de construire un building.
# Achetables au Village Card Shop (boutique de raretés) à partir du niveau 11.
# Une fois possédée, le joueur peut lancer la construction via Pedro.
# card_max_owned: 1 — on ne peut construire qu'un exemplaire de chaque.
# =====================================================================

# ------------------------------------------------------------------
# CUISINE DE BASE
# Production : plats cuisinés → buffs temporaires (XP, récolte)
# Carburant  : bois
# ------------------------------------------------------------------
- key: building_basic_kitchen
  enabled: true
  card_type: building_access
  card_category: building
  card_tags:
  - building
  - kitchen
  - food
  card_label: Cuisine de base
  card_description: >
    Débloque la construction d'une Cuisine de base.
    Cuisinez des plats qui vous accorderont des bonus temporaires
    d'XP et de récolte. Fonctionne au bois.
  card_image: /static/assets/img/cards/buildings/card_building_basic_kitchen.png
  card_rarity: uncommon
  card_gameplay:
    building_key: basic_kitchen
  shop:
    prices:
    - coins: 5000
      diams: 0
      resources: {}
    - coins: 0
      diams: 20
      resources: {}
    show_in_main_shop: false
    show_in_village_shop: true
    buy_rules:
      min_level: 11
  tradable: false
  giftable: false
  card_quantity: null   # illimité en stock
  card_purchase_limit_quantity: null
  card_max_owned: 1

