# =====================================================================
# LAND SLOT CARDS
# Add extra slots on lands.
# card_type: land_slot
# categorie: land
# =====================================================================

- key: beach_free_slot
  enabled: true
  card_type: land_slot
  card_category: land
  card_tags:
  - beach
  card_label: Beach Free Slot
  card_description: Débloque un slot supplémentaire sur la Plage.
  card_image: /static/assets/img/cards/default_card.png
  card_rarity: uncommon
  card_gameplay:
    land: beach
    slots: 1
  shop:
    prices:
    - coins: 0
      diams: 0
      resources: {}
    show_in_main_shop: false
    show_in_village_shop: false
    buy_rules: null
  tradable: false
  giftable: true
  card_quantity: 0
  card_purchase_limit_quantity: null
  card_max_owned: 1

