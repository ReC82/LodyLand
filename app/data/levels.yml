levels:
- level: 0
  xp_required: 0
  rewards: []
  story_events:
  - id: intro_forest_wakeup
    trigger: on_first_login
    show_once: true
    modal_variant: full
    pages:
    - speaker: self
      mood: confused
      text:
        fr: 'Aaah… ma tête… Qu’est-ce qui s’est passé ?

          '
        en: 'Ugh… my head… What happened?

          '
    - speaker: self
      mood: lost
      text:
        fr: 'Où est-ce que je suis ? C’est… une forêt ? Je ne me souviens de rien.
          Ni d’où je viens… Ni même de mon nom.

          '
        en: 'Where am I? This… is a forest? I don’t remember anything. Where I came
          from… Not even my name.

          '
    - speaker: self
      mood: thinking
      text:
        fr: 'Ok. Respire. Panique plus tard. D’abord, il faut survivre.

          '
        en: 'Okay. Breathe. Panic later. First, I need to survive.

          '
    - speaker: self
      mood: observing
      text:
        fr: 'Autour de moi, il y a des branches, des feuilles, des pierres… Si je
          clique sur ces cases de terrain, je peux sûrement ramasser des ressources.

          '
        en: 'Around me, there are branches, leaves, rocks… If I click on these tiles,
          I can probably gather some resources.

          '
    - speaker: self
      mood: determined
      text:
        fr: 'Allez. Je commence par là : cliquer sur les slots de la forêt pour récupérer
          tout ce qui peut m’aider à rester en vie.

          '
        en: 'Alright. Let’s start with that: click on the forest slots and pick up
          anything that can help me stay alive.

          '
    quest_start:
      quest_key: q_first_gather
- level: 1
  xp_required: 10
  rewards: []
  system_unlocks:
  - type: feature
    key: notebook
  story_events:
  - id: level_1_explain_progress
    trigger: on_level_reached
    show_once: true
    modal_variant: centered
    pages:
    - speaker: self
      mood: surprised
      text:
        fr: 'Tiens… je me sens un peu plus en forme. Comme si chaque action me rendait
          plus fort.

          '
        en: 'Huh… I feel a bit stronger. Like every action is making me level up.

          '
    - speaker: self
      mood: explaining
      text:
        fr: 'Mais, qu''est ce que c''est ? On dirait un vieux carnet de notes.

          '
        en: ''
    - speaker: self
      mood: curious
      text:
        fr: 'Si je continue à récolter tout ce que je trouve, je finirai bien par
          comprendre ce qui se cache sur cette île.

          '
        en: 'If I keep collecting everything I can, I’ll eventually figure out what’s
          hidden on this island.

          '
- level: 2
  xp_required: 40
  rewards:
  - type: card
    card_key: land_beach
  story_events:
  - id: unlock_beach_card
    trigger: on_level_reached
    land_key: land_beach
    show_once: true
    modal_variant: centered
    pages:
    - speaker: self
      mood: surprised
      text:
        fr: 'Une plage ? Donc cette île ne se résume pas à la forêt…

          '
        en: 'A beach? So this island is more than just a forest…

          '
    - speaker: self
      mood: observing
      text:
        fr: 'Du sable, de l’eau salée, du bois flotté… Je pourrais sans doute trouver
          d’autres ressources ici.

          '
        en: 'Sand, salt water, driftwood… I can probably find different resources
          here.

          '
    - speaker: self
      mood: focused
      text:
        fr: 'Et là-bas… on dirait de la fumée qui monte dans le ciel. S’il y a du
          feu, il y a peut-être quelqu’un.

          '
        en: 'And over there… looks like smoke rising into the sky. If there’s fire,
          maybe somebody is there.

          '
    - speaker: self
      mood: determined
      text:
        fr: 'Je vais essayer de m’en approcher en ramassant tout ce que je peux sur
          le chemin.

          '
        en: 'I’ll try to reach it while gathering everything I can along the way.

          '
- level: 3
  xp_required: 100
  rewards:
  - type: coins
    amount: 100
  - type: card
    card_key: land_village
  - type: diams
    amount: 1
  system_unlocks:
  - type: feature
    key: hud_currencies
  - type: feature
    key: daily_chest
  - type: feature
    key: resource_market
  - type: feature
    key: global_shop
  - type: feature
    key: quest_system
  - type: feature
    key: travel_system
  story_events:
  - id: village_first_visit
    trigger: on_level_reached
    land_key: land_village
    show_once: true
    modal_variant: full
    pages:
    - speaker: npc_villager_guide
      portrait: villager_guide
      mood: friendly
      text:
        fr: 'Hé toi ! Tu as l’air un peu perdu. Bienvenue au village… ou ce qu’il
          en reste.

          '
        en: 'Hey you! You look a bit lost. Welcome to the village… or what’s left
          of it.

          '
    - speaker: npc_villager_guide
      mood: explaining
      text:
        fr: 'Ici, tu peux vendre les ressources que tu trouves contre des pièces.
          Avec ces pièces, tu peux acheter des cartes, débloquer de nouveaux lieux
          et améliorer ton équipement.

          '
        en: 'Here, you can sell the resources you gather for coins. With those coins,
          you can buy cards, unlock new places and upgrade your gear.

          '
    - speaker: npc_villager_guide
      mood: explaining
      text:
        fr: 'Parfois, tu gagneras aussi des diamants. Ils sont rares, garde-les pour
          les choses vraiment importantes.

          '
        en: 'Sometimes you’ll earn diamonds too. They’re rare, save them for really
          important things.

          '
    - speaker: npc_villager_guide
      mood: hint
      text:
        fr: 'Chaque jour, tu peux ouvrir un coffre gratuit. Passe le voir, même si
          tu n’as pas beaucoup de temps.

          '
        en: 'Every day, you can open a free chest. Don’t forget to grab it, even on
          busy days.

          '
    - speaker: npc_villager_guide
      mood: hint
      text:
        fr: 'Et si tu as besoin de direction, regarde les quêtes. Elles te guideront
          vers ce que tu devrais faire ensuite.

          '
        en: 'And if you need direction, check your quests. They’ll guide you toward
          what you should do next.

          '
    - speaker: self
      mood: determined
      text:
        fr: 'Donc… récolter, vendre, acheter des cartes, accomplir des quêtes… Si
          je veux comprendre ce qu’il se passe sur cette île, il va falloir que je
          m’y mette sérieusement.

          '
        en: 'So… gather, sell, buy cards, complete quests… If I want to understand
          what’s going on with this island, I have to get serious about it.

          '
- level: 4
  xp_required: 300
