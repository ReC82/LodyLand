quest_templates:

  weekly_forest_supply:
    key: qt_weekly_forest_supply
    quest_type: weekly
    difficulty: easy
    category: forest
    enabled: true
    min_player_level: 3
    required_land_keys:
    - land_forest
    title:
      fr: Approvisionnement hebdomadaire de la forêt
      en: Weekly forest supplies
    description:
      fr: 'Le village a besoin d''un gros stock de ressources de la forêt pour la
        semaine. Apporte tout ce qu''il faut et tu seras généreusement récompensé.

        '
      en: 'The village needs a big stock of forest resources for the week. Bring everything
        they need and you will be well rewarded.

        '
    sources:
    - auto_weekly
    objective_templates:
    - kind: collect_resource
      resource_keys:
      - branch
      - palm_leaf
      - vine
      quantity_min: 60
      quantity_max: 80
      ignore_boosts: true
    reward_templates:
      shards_min: 80
      shards_max: 120
      essence_min: 0
      essence_max: 2
      xp_min: 90
      xp_max: 150

  weekly_mixed_medium:
    key: qt_weekly_mixed_medium
    quest_type: weekly
    difficulty: medium
    category: forest
    enabled: true
    min_player_level: 3
    required_land_keys:
    - land_forest
    title:
      fr: Approvisionnement mixte
      en: Mixed weekly resupply
    description:
      fr: Le village a besoin d'un lot varié de ressources pour la semaine.
      en: The village needs a varied batch of resources for the week.
    sources:
    - auto_weekly
    objective_templates:
    - kind: collect_resource
      resource_keys:
      - branch
      - wood
      - small_stone
      quantity_min: 50
      quantity_max: 70
      ignore_boosts: false
    reward_templates:
      shards_min: 100
      shards_max: 145
      essence_min: 0
      essence_max: 2
      xp_min: 110
      xp_max: 180

  weekly_full_supply_hard:
    key: qt_weekly_full_supply_hard
    quest_type: weekly
    difficulty: hard
    category: forest
    enabled: true
    min_player_level: 5
    required_land_keys:
    - land_forest
    title:
      fr: Grand approvisionnement
      en: Grand weekly supply
    description:
      fr: Le village prépare des festivités. Il faut des ressources de partout.
      en: The village is preparing celebrations. Resources from everywhere needed.
    sources:
    - auto_weekly
    objective_templates:
    - kind: collect_resource
      resource_keys:
      - branch
      - wood
      - vine
      - palm_leaf
      - small_stone
      quantity_min: 75
      quantity_max: 100
      ignore_boosts: false
    reward_templates:
      shards_min: 140
      shards_max: 200
      essence_min: 1
      essence_max: 3
      xp_min: 160
      xp_max: 260
