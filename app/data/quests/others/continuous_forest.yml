quest_templates:

  continuous_branch_supply:
    key: qt_continuous_branch_supply
    quest_type: continuous
    difficulty: easy
    category: gathering
    enabled: true
    min_player_level: 3
    required_land_keys:
    - land_forest
    title:
      fr: Réserve de branches
      en: Branch reserve
    description:
      fr: Le village a toujours besoin de branches. Continue à en apporter régulièrement.
      en: The village always needs branches. Keep bringing them regularly.
    sources:
    - auto_continuous
    objective_templates:
    - kind: collect_resource
      resource_keys:
      - branch
      quantity_min: 25
      quantity_max: 35
      ignore_boosts: true
    reward_templates:
      shards_min: 28
      shards_max: 48
      essence_min: 0
      essence_max: 1
      xp_min: 30
      xp_max: 55

