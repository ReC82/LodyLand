quest_templates:
  qt_daily_forest_craft_rope:
    key: qt_daily_forest_craft_rope
    quest_type: daily
    category: crafting
    enabled: true
    min_player_level: 3
    max_player_level: 15
    required_land_keys:
    - land_forest
    title:
      fr: Cordes pour le village
      en: Ropes for the village
    description:
      fr: Fabrique quelques cordes à partir de lianes pour aider les villageois.
      en: Craft some ropes from vines to help the villagers.
    sources:
    - auto_daily
    - villager_generic
    objective_templates:
    - kind: craft_item
      item_keys:
      - item_rope
      quantity_min: 1
      quantity_max: 3
    reward_templates:
      shards_min: 15
      shards_max: 30
      essence_min: 0
      essence_max: 1
  qt_daily_forest_leaves_and_vine:
    key: qt_daily_forest_leaves_and_vine
    quest_type: daily
    category: gathering
    enabled: true
    min_player_level: 4
    max_player_level: 20
    required_land_keys:
    - land_forest
    title:
      fr: Feuilles et lianes
      en: Leaves and vines
    description:
      fr: Les villageois ont besoin de feuilles et de lianes pour leurs constructions.
      en: Villagers need leaves and vines for their constructions.
    sources:
    - auto_daily
    - villager_generic
    objective_templates:
    - kind: collect_resource
      resource_keys:
      - palm_leaf
      - vine
      quantity_min: 6
      quantity_max: 14
      ignore_boosts: true
    reward_templates:
      shards_min: 18
      shards_max: 32
      essence_min: 0
      essence_max: 1
  qt_daily_forest_mix_basic_resources:
    key: qt_daily_forest_mix_basic_resources
    quest_type: daily
    category: farming
    enabled: true
    min_player_level: 5
    max_player_level: 25
    required_land_keys:
    - land_forest
    title:
      fr: Approvisionnement de base
      en: Basic supplies
    description:
      fr: Prépare un stock mixte de ressources pour le village.
      en: Prepare a mixed stock of resources for the village.
    sources:
    - auto_daily
    - villager_generic
    objective_templates:
    - kind: collect_resource
      resource_keys:
      - branch
      - wood
      - small_stone
      quantity_min: 15
      quantity_max: 30
      ignore_boosts: true
    reward_templates:
      shards_min: 20
      shards_max: 40
      essence_min: 0
      essence_max: 2
  qt_daily_forest_stone_small:
    key: qt_daily_forest_stone_small
    quest_type: daily
    category: mining
    enabled: true
    min_player_level: 2
    max_player_level: 12
    required_land_keys:
    - land_forest
    title:
      fr: Petites pierres utiles
      en: Useful small stones
    description:
      fr: Rassemble quelques petites pierres pour les artisans du village.
      en: Collect some small stones for the village crafters.
    sources:
    - auto_daily
    - villager_generic
    objective_templates:
    - kind: collect_resource
      resource_keys:
      - small_stone
      quantity_min: 5
      quantity_max: 12
      ignore_boosts: true
    reward_templates:
      shards_min: 10
      shards_max: 22
      essence_min: 0
      essence_max: 1
  qt_daily_forest_wood_basic:
    key: qt_daily_forest_wood_basic
    quest_type: daily
    category: farming
    enabled: true
    min_player_level: 1
    max_player_level: 10
    required_land_keys:
    - land_forest
    title:
      fr: Bois pour le feu
      en: Wood for the fire
    description:
      fr: Le village a besoin de bois pour le feu du soir.
      en: The village needs wood for tonight's fire.
    sources:
    - auto_daily
    - villager_generic
    objective_templates:
    - kind: collect_resource
      resource_keys:
      - branch
      - wood
      quantity_min: 8
      quantity_max: 15
      ignore_boosts: true
    reward_templates:
      shards_min: 12
      shards_max: 25
      essence_min: 0
      essence_max: 1
  qt_story_beach_01_discover:
    key: qt_story_beach_01_discover
    quest_type: storyline
    category: storyline
    enabled: true
    storyline_id: main_02_beach
    storyline_step: 2
    requires_quests_completed: []
    min_player_level: 1
    required_land_keys:
    - land_beach
    title:
      fr: L'air frais de la plage.
      en: ''
    description:
      fr: 'Tu as avancé jusqu''à tomber sur une plage.  Essaye de trouver quelques
        resources intéressantes.

        '
      en: 'You wake up in an unknown forest. Start by gathering a few branches to
        make a fire.

        '
    sources:
    - system_storyline
    objective_templates:
    - kind: collect_resource
      resource_keys:
      - seashell
      quantity_min: 1
      quantity_max: 1
      ignore_boosts: true
    reward_templates:
      shards_min: 50
      shards_max: 75
      essence_min: 0
      essence_max: 0
  qt_story_cave_01_unlock:
    key: qt_story_cave_01_unlock
    quest_type: storyline
    category: storyline
    enabled: true
    storyline_id: main_03_cave
    storyline_step: 3
    requires_quests_completed:
    - qt_story_beach_01_discover
    min_player_level: 3
    required_land_keys:
    - land_forest
    title:
      fr: Entrer dans la grotte
      en: Enter the cave
    description:
      fr: 'Tu as fabriqué tes torches. Il est temps de déverrouiller l''accès à la
        grotte et de découvrir ce qu''elle cache.

        '
      en: 'You crafted your torches. Now unlock the cave and see what''s inside.

        '
    sources:
    - system_storyline
    objective_templates:
    - kind: unlock_land
      land_keys:
      - land_cave
      quantity_min: 1
      quantity_max: 1
    reward_templates:
      shards_min: 30
      shards_max: 30
      essence_min: 0
      essence_max: 1
  qt_story_forest_01_wake_up:
    key: qt_story_forest_01_wake_up
    quest_type: storyline
    category: storyline
    enabled: true
    storyline_id: main_01_forest
    storyline_step: 1
    requires_quests_completed: []
    min_player_level: 1
    required_land_keys:
    - land_forest
    title:
      fr: Où suis-je ?
      en: Where am I?
    description:
      fr: 'Tu te réveilles dans une forêt inconnue. Commence par ramasser quelques
        branches pour te rassurer et faire un feu.

        '
      en: 'You wake up in an unknown forest. Start by gathering a few branches to
        make a fire.

        '
    sources:
    - system_storyline
    objective_templates:
    - kind: collect_resource
      resource_keys:
      - branch
      quantity_min: 3
      quantity_max: 3
      ignore_boosts: true
    reward_templates:
      shards_min: 0
      shards_max: 0
      essence_min: 0
      essence_max: 0
  qt_weekly_forest_supply:
    key: qt_weekly_forest_supply
    quest_type: weekly
    category: forest
    enabled: true
    min_player_level: 3
    title:
      fr: Approvisionnement hebdomadaire de la forêt
      en: Weekly forest supplies
    description:
      fr: 'Le village a besoin d''un gros stock de ressources de la forêt pour la
        semaine. Apporte tout ce qu''il faut et tu seras généreusement récompensé.

        '
      en: 'The village needs a big stock of forest resources for the week. Bring everything
        they need and you will be well rewarded.

        '
    sources:
    - auto_weekly
    objective_templates:
    - kind: collect_resource
      resource_keys:
      - branch
      - palm_leaf
      - vine
      quantity_min: 60
      quantity_max: 80
      ignore_boosts: true
    reward_templates:
      shards_min: 120
      shards_max: 160
      essence_min: 0
      essence_max: 2
