quest_templates:

  story_cave_01_prepare:
    key: "qt_story_cave_01_prepare"
    quest_type: "storyline"
    category: "storyline"
    enabled: true

    storyline_id: "main_02_cave"
    storyline_step: 1
    # Ne s'active que si la première a été complétée
    requires_quests_completed:
      - "qt_story_forest_01_wake_up"

    min_player_level: 3
    required_land_keys:
      - "land_forest"

    title:
      fr: "Un passage mystérieux"
      en: "A mysterious passage"

    description:
      fr: >
        Les villageois parlent d'une grotte cachée. Prépare-toi en fabriquant
        quelques torches.
      en: >
        Villagers whisper about a hidden cave. Get ready by crafting some torches.

    sources:
      - "system_storyline"

    objective_templates:
      - kind: "craft_item"
        item_keys: ["item_torch_basic"]
        quantity_min: 3
        quantity_max: 3

    reward_templates:
      coins_min: 20
      coins_max: 20
      diams_min: 0
      diams_max: 1
