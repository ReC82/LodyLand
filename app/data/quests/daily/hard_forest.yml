    title:
      fr: Production de cordes
      en: Rope production run
    description:
      fr: Les pêcheurs ont besoin de nombreuses cordes solides pour leurs filets.
      en: The fishermen need many strong ropes for their nets.
    sources:
    - auto_daily
    objective_templates:
    - kind: craft_item
      item_keys:
