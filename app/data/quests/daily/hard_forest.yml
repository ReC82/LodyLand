quest_templates:

  daily_forest_bulk_hard:
    key: qt_daily_forest_bulk_hard
    quest_type: daily
    difficulty: hard
    category: gathering
    enabled: true
    min_player_level: 5
    required_land_keys:
    - land_forest
    title:
      fr: Grande récolte de bois
      en: Large wood harvest
    description:
      fr: Le village prépare de grandes constructions. Il faut énormément de bois.
      en: The village is preparing for major construction. A lot of wood is needed.
    sources:
    - auto_daily
    objective_templates:
    - kind: collect_resource
      resource_keys:
      - branch
      - wood
      quantity_min: 45
      quantity_max: 60
      ignore_boosts: false
    reward_templates:
      shards_min: 50
      shards_max: 75
      essence_min: 0
      essence_max: 2
      xp_min: 55
      xp_max: 90

  daily_rope_production_hard:
