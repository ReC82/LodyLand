quest_templates:

  daily_branch_easy:
    key: qt_daily_branch_easy
    quest_type: daily
    difficulty: easy
    category: gathering
    enabled: true
    min_player_level: 1
    max_player_level: 15
    required_land_keys:
    - land_forest
    title:
      fr: Collecte de branches
      en: Branch collection
    description:
      fr: Les villageois ont besoin de branches pour leurs travaux quotidiens.
      en: The villagers need branches for their daily work.
    sources:
    - auto_daily
    objective_templates:
    - kind: collect_resource
      resource_keys:
      - branch
      quantity_min: 12
      quantity_max: 20
      ignore_boosts: true
    reward_templates:
      shards_min: 10
      shards_max: 20
      essence_min: 0
      essence_max: 0
      xp_min: 10
      xp_max: 18

