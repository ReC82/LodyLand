quest_templates:

  daily_wood_medium:
    key: qt_daily_wood_medium
    quest_type: daily
    difficulty: medium
    category: gathering
    enabled: true
    min_player_level: 3
    required_land_keys:
    - land_forest
    title:
      fr: Bois en quantité
      en: Wood in quantity
    description:
      fr: L'atelier du village a besoin d'un bon lot de bois travaillé.
      en: The village workshop needs a solid batch of worked wood.
    sources:
    - auto_daily
    objective_templates:
    - kind: collect_resource
      resource_keys:
      - wood
      quantity_min: 18
      quantity_max: 28
      ignore_boosts: false
    reward_templates:
      shards_min: 22
      shards_max: 36
      essence_min: 0
      essence_max: 1
      xp_min: 25
      xp_max: 45

